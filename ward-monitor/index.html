<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WardWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell. Fixed left rail (bottom tabs on phones), sticky top bar, priority-sorted bed grid, right-side patient drawer. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f4f7f8; --sunk:#e5ebed;
  --ink:#132029; --ink-2:#3b4b56; --muted:#62737e; --line:#d6dee2;
  --accent:#0b6b77; --accent-ink:#ffffff; --accent-soft:#dcefF1;
  --crit:#c42b22; --crit-bg:#fce9e7; --crit-line:#efb3ad;
  --warn:#9a5b00; --warn-fill:#e9a21b; --warn-bg:#fdf2da; --warn-line:#efd08a;
  --ok:#1d7346; --ok-bg:#e3f2e9; --ok-line:#b5dcc4; --band:rgba(29,115,70,.09);
  --info:#2f5c9e; --info-bg:#e5edf8;
  --shadow:0 1px 2px rgba(19,32,41,.06),0 4px 16px rgba(19,32,41,.06);
  --f-ui:"IBM Plex Sans Thai",system-ui,"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1316; --surface:#131d22; --surface-2:#18242a; --sunk:#0f181c;
    --ink:#e3ebee; --ink-2:#b8c6cc; --muted:#8a9ca5; --line:#24343b;
    --accent:#45b8c4; --accent-ink:#06181b; --accent-soft:#12343a;
    --crit:#ff7366; --crit-bg:#3a1613; --crit-line:#6e2a24;
    --warn:#f4b942; --warn-fill:#e9a21b; --warn-bg:#31260d; --warn-line:#5f4a17;
    --ok:#56cf8b; --ok-bg:#0f2d1e; --ok-line:#1d5137; --band:rgba(86,207,139,.10);
    --info:#8db4f0; --info-bg:#16263d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1316; --surface:#131d22; --surface-2:#18242a; --sunk:#0f181c;
  --ink:#e3ebee; --ink-2:#b8c6cc; --muted:#8a9ca5; --line:#24343b;
  --accent:#45b8c4; --accent-ink:#06181b; --accent-soft:#12343a;
  --crit:#ff7366; --crit-bg:#3a1613; --crit-line:#6e2a24;
  --warn:#f4b942; --warn-fill:#e9a21b; --warn-bg:#31260d; --warn-line:#5f4a17;
  --ok:#56cf8b; --ok-bg:#0f2d1e; --ok-line:#1d5137; --band:rgba(86,207,139,.10);
  --info:#8db4f0; --info-bg:#16263d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
[hidden]{display:none!important}

/* demo strip */
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 16px;background:var(--ink);color:var(--bg);font-size:13px}
.demo b{font-weight:600;letter-spacing:.02em}
.demo .seg{display:flex;gap:2px;background:rgba(127,127,127,.25);border-radius:999px;padding:2px}
.demo .seg button{border:0;background:transparent;color:inherit;padding:3px 12px;border-radius:999px;font-size:13px}
.demo .seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600}
.demo .sp{flex:1}
.demo .lnk{border:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:0}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 34px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{font-size:16px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.rail .grow{flex:1}
.me{display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line);margin-top:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink-2);flex:none}
.me div{min-width:0}
.me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:600}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:9px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:-5px;right:-5px}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}

/* badges, pills */
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--crit);color:#fff;font-size:11.5px;font-weight:600;font-family:var(--f-num)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid}
.pill svg{width:13px;height:13px}
.pill.l0{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.pill.l1{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.pill.l2{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.pill.n{color:var(--ink-2);background:var(--surface-2);border-color:var(--line)}
.pill.i{color:var(--info);background:var(--info-bg);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.chip b{font-family:var(--f-num);font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* summary */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.stat[aria-pressed="true"]{outline:2px solid var(--ink-2);outline-offset:-2px}
.stat .lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.stat .lab svg{width:15px;height:15px}
.stat .big{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.15}
.stat .hint{font-size:12px;color:var(--muted)}
.stat.l2 .lab,.stat.l2 .big{color:var(--crit)}
.stat.l1 .lab,.stat.l1 .big{color:var(--warn)}
.stat.l0 .lab,.stat.l0 .big{color:var(--ok)}
.stat.l2.hot{background:var(--crit-bg);border-color:var(--crit-line)}
.brands{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.brands h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.brands h3 span{color:var(--muted);font-weight:400}
.brow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;font-size:12px}
.brow > span{color:var(--muted)}
.stack{display:flex;gap:4px;flex-wrap:wrap}
.stack .chip{font-size:11.5px}
.stack .chip i{font-style:normal;font-family:var(--f-num);color:var(--ink);font-weight:600}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg2{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:36px;min-width:0;flex:1 1 200px;max-width:320px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:14px}
.toolbar .count{margin-left:auto;font-size:13px;color:var(--muted)}

/* bed grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.bed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;text-align:left;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease}
.bed:hover{transform:translateY(-1px)}
.bed.sel{outline:2px solid var(--accent);outline-offset:1px}
.bed-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.bed.l2 .bed-hd{background:var(--crit-bg);border-bottom-color:var(--crit-line)}
.bed.l1 .bed-hd{background:var(--warn-bg);border-bottom-color:var(--warn-line)}
.bed.l2{border-color:var(--crit-line)}
.bed.l1{border-color:var(--warn-line)}
.bedno{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--ink-2)}
.bedno small{font-family:var(--f-ui);font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.bed-bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
.pt b{font-size:15.5px;font-weight:600;display:block;line-height:1.3}
.pt span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.m{border-radius:7px;background:var(--surface-2);padding:5px 8px 4px;display:flex;flex-direction:column;border:1px solid transparent}
.m .ml{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.m .mv{font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.2;white-space:nowrap}
.m .mv small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.m.l1{background:var(--warn-bg);border-color:var(--warn-line)} .m.l1 .mv{color:var(--warn)}
.m.l2{background:var(--crit-bg);border-color:var(--crit-line)} .m.l2 .mv{color:var(--crit)}
.bed-ft{margin-top:auto;font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.bed-ft .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bed-ft .msg{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed.l2 .bed-ft .msg{color:var(--crit)}
.bed.l1 .bed-ft .msg{color:var(--warn)}
.bed-ft .meta{color:var(--muted);white-space:nowrap}
.bed-ft .state{font-size:12px;color:var(--muted)}
.bed-ft .state strong{color:var(--crit);font-weight:600}
.quiet{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.15);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.dr-hd{padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-hd .t{flex:1;min-width:0}
.dr-hd h2{font-size:18px;font-weight:600}
.dr-hd .t p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dr-bd{overflow:auto;padding:16px 18px 32px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec > h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec > h3 .chip{font-weight:400}
.sec > h3 .r{margin-left:auto}
.vrow{display:grid;grid-template-columns:116px minmax(0,1fr) 88px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.vrow .vn{font-size:12.5px;color:var(--muted);line-height:1.3}
.vrow .vn b{display:block;color:var(--ink);font-size:13.5px}
.vrow .vv{text-align:right;font-family:var(--f-num);font-weight:600;font-size:21px;line-height:1.1}
.vrow .vv small{display:block;font-size:11px;color:var(--muted);font-weight:500;font-family:var(--f-ui)}
.vrow.l1 .vv{color:var(--warn)} .vrow.l2 .vv{color:var(--crit)}
.vrow svg{width:100%;height:44px;display:block}
.refnote{font-size:12px;color:var(--muted);margin-top:8px}
.iv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center}
.iv svg{width:72px;height:112px}
.ivstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ivstats div{background:var(--surface-2);border-radius:7px;padding:6px 9px}
.ivstats span{display:block;font-size:11.5px;color:var(--muted)}
.ivstats b{font-family:var(--f-num);font-size:17px;font-weight:600}
.ivstats .l1 b{color:var(--warn)} .ivstats .l2 b{color:var(--crit)}

/* alert cards */
.al{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.al + .al{margin-top:10px}
.al.l2{border-color:var(--crit-line)} .al.l1{border-color:var(--warn-line)}
.al-hd{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2)}
.al.l2 .al-hd{background:var(--crit-bg)} .al.l1 .al-hd{background:var(--warn-bg)}
.al-hd .msg{font-weight:600;flex:1;min-width:0}
.al-hd time{font-size:12px;color:var(--muted);white-space:nowrap}
.al-bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px}
.steps div{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border-top:3px solid var(--line)}
.steps div b{color:var(--ink-2);font-weight:600}
.steps div.done{border-top-color:var(--ok)}
.steps div.now{border-top-color:var(--accent);background:var(--accent-soft)}
.steps div.now b{color:var(--accent)}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--ink-2);font-weight:500}
.esc{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.esc strong{font-family:var(--f-num);color:var(--crit)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-line);background:var(--surface)}
.btn.big{padding:11px 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none}
textarea,.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
textarea:focus,.inp:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink-2)}
.done-note{font-size:13px;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:8px;padding:8px 10px}
.mini{font-size:13px;display:flex;flex-direction:column}
.mini div{display:grid;grid-template-columns:52px 72px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.mini div:first-child{border-top:0}
.mini time{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.mini span{min-width:0}

/* tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12px;color:var(--muted)}
td.t{font-family:var(--f-num);font-size:12.5px;white-space:nowrap}
tr.pending td{background:var(--warn-bg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.filters select{min-width:180px}
.filters label.search{flex-direction:row;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-num);font-size:24px;font-weight:600}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.banner svg{width:18px;height:18px;flex:none;color:var(--info);margin-top:2px}

/* auth */
.auth{min-height:calc(100% - 34px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth-art{background:var(--ink);color:var(--bg);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.auth-art h1{font-size:30px;font-weight:600;max-width:20ch}
.auth-art p{color:color-mix(in srgb,var(--bg) 70%,transparent);max-width:46ch}
.auth-art canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;opacity:.9}
.auth-form{display:grid;place-items:center;padding:32px 20px;background:var(--bg)}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card h2{font-size:21px;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:9px;padding:3px}
.tabs button{border:0;background:none;padding:7px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.err{color:var(--crit);font-size:13px}
.wait{display:flex;flex-direction:column;gap:12px}
.wait ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* toasts */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:pop .2s ease-out}
.toast.l2{border-color:var(--crit-line);background:var(--crit-bg)}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}
.toast.l2 svg{color:var(--crit)}
.toast.ok svg{color:var(--ok)}
.toast small{display:block;color:var(--muted);font-size:12px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* spec page */
.spec{display:flex;flex-direction:column;gap:18px;max-width:1100px}
.spec h2{font-size:17px;font-weight:600;margin-bottom:4px}
.spec .lead{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:72ch}
.spec section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.yes{color:var(--ok);font-weight:600}.no{color:var(--muted)}.scope{color:var(--info);font-weight:500}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow > div{flex:1 1 150px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;position:relative}
.flow > div b{display:block;font-size:12px;color:var(--accent);font-family:var(--f-num);letter-spacing:.04em}
.flow-title{font-size:14px;font-weight:600;margin:14px 0 8px}
.flow-title:first-of-type{margin-top:0}
.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.states div{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;font-size:13.5px}
.principles div b{display:block;font-size:14px}
.principles div p{margin:2px 0 0;color:var(--ink-2)}
.assume{font-size:13px;color:var(--ink-2);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* phone */
@media (max-width: 900px){
  .summary{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brands{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .states{grid-template-columns:repeat(2,minmax(0,1fr))}
  .principles{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px 20px 120px}
  .auth-art h1{font-size:23px}
}
@media (max-width: 760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:15;justify-content:space-around}
  .rail .brand,.rail .grow,.rail .me{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;position:relative}
  .nav .badge{position:absolute;top:0;right:4px;margin:0}
  .content{padding:14px 16px 96px}
  .top{padding:10px 16px}
  .top h1{font-size:17px}
  .summary{gap:8px}
  .stat{padding:10px}
  .stat .big{font-size:24px}
  .stat .hint{display:none}
  .vrow{grid-template-columns:96px minmax(0,1fr) 74px}
  .toolbar .count{margin-left:0}
  .search{max-width:none}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function ago(t){ const s=Math.max(0,Math.round((Date.now()-t)/1000)); if(s<60) return s+' วินาที'; const m=Math.floor(s/60); if(m<60) return m+' นาที'; const h=Math.floor(m/60); if(h<24) return h+' ชม. '+(m%60)+' นาที'; return Math.floor(h/24)+' วัน'; }
function dur(ms){ const m=Math.round(ms/60000); return m<60? m+' นาที' : Math.floor(m/60)+' ชม. '+(m%60)+' นาที'; }
function mmss(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+pad(s%60); }

/* RLS mirror: which patients this role can see */
function visiblePatients(){
  if(S.role==='nurse'){ const w=staff(meId()).ward; return P.filter(p=>p.ward===w); }
  if(S.role==='physician') return P.filter(p=>p.doc===meId());
  return [];
}
const openAlerts = pid => ALERTS.filter(a=>a.pid===pid && !a.resolved_at).sort((a,b)=>b.level-a.level||a.created-b.created);
function patientLevel(p){
  let l=0;
  for(const k in p.v){ if(TH[k]) l=Math.max(l,lvlOf(k,p.v[k])); }
  if(p.pump==='occlusion') l=2;
  for(const a of openAlerts(p.id)) l=Math.max(l,a.level);
  return l;
}

/* ---------- simulation (stands in for ESP32 + ventilator script → Supabase Realtime) ---------- */
function tick(){
  for(const p of P){
    if(p.base){
      for(const k of VENT_P){
        let x=p.v[k]; x += (p.base[k]-x)*.18 + (Math.random()-.5)*2*SD[k];
        const t=TH[k]; x=Math.min(t.max,Math.max(t.min,x)); p.v[k]=x; p.h[k].push(x); if(p.h[k].length>40) p.h[k].shift();
      }
    }
    if(p.iv){
      if(p.pump==='running'){ p.ivMl=Math.max(0,p.ivMl - p.iv.rate/60); }
      p.v.remaining_pct = p.ivMl/p.iv.vol*100;
      p.h.remaining_pct.push(p.v.remaining_pct); if(p.h.remaining_pct.length>40) p.h.remaining_pct.shift();
    }
    // alert logic (mirrors the backend rule: create when a parameter crosses into a worse level)
    for(const k in p.v){
      if(!TH[k]) continue;
      const l=lvlOf(k,p.v[k]); if(!l) continue;
      const open=ALERTS.find(a=>a.pid===p.id&&a.param===k&&!a.resolved_at);
      if(open && open.level>=l) continue;
      const t=TH[k], val=Math.round(p.v[k]);
      const msg = k==='remaining_pct' ? `สารน้ำเหลือ ${val}%` : `${t.label} ${t.dir==='low'?'ต่ำ':'สูง'} ${val}${t.unit==='%'?'%':' '+t.unit}`;
      const a=mkAlert({pid:p.id,param:k,level:l,msg,cat:t.cat,created:Date.now()});
      if(visiblePatients().some(v=>v.id===p.id)) notifyNew(a,p);
    }
  }
  // auto-escalate when nobody acknowledged in time
  for(const a of ALERTS){
    if(!a.resolved_at && !a.acked_at && !a.escalated && Date.now()-a.created > a.after*60000){
      a.escalated=true; a.escalated_at=Date.now(); a.auto=true;
      const p=P.find(x=>x.id===a.pid);
      if(visiblePatients().includes(p)) toast(`ส่งต่ออัตโนมัติ · เตียง ${p.bed}`, `ไม่มีผู้รับทราบภายใน ${a.after} นาที ระบบแจ้ง${a.to}แล้ว`, a.level);
    }
  }
  S.lastTick=Date.now();
  if(S.auth==='app') refreshLive();
}
// occasional deterioration so the board stays realistic
function perturb(){
  const pool=P.filter(p=>p.base && patientLevel(p)===0); if(!pool.length) return;
  const p=pool[Math.floor(Math.random()*pool.length)];
  const k=['spo2','resp_rate','peak_pressure','leak','tidal_volume'][Math.floor(Math.random()*5)];
  const t=TH[k], tgt = t.dir==='low' ? t.warn-(Math.random()<.35?(t.warn-t.crit)+1.5:1.5) : t.warn+(Math.random()<.35?(t.crit-t.warn)+1.5:1.5);
  p.base[k]=tgt;
}
function notifyNew(a,p){
  if(a.level===2) toast(`แจ้งเตือนวิกฤต · เตียง ${p.bed} ${p.name}`, `${a.msg} · ส่งอีเมลถึงพยาบาลประจำหอและแพทย์เจ้าของไข้แล้ว`, 2);
  else if(Date.now()-now0>8000) toast(`เฝ้าระวัง · เตียง ${p.bed}`, a.msg, 1);
}
function toast(title,body,kind){
  const el=document.createElement('div'); el.className='toast '+(kind===2?'l2':kind==='ok'?'ok':'');
  el.innerHTML=`${kind===2?I.l2:kind===1?I.l1:kind==='mail'?I.mail:I.check}<div><b>${esc(title)}</b><small>${esc(body)}</small></div>`;
  const box=document.getElementById('toasts'); box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(),6000);
}

/* ---------- charts ---------- */
function spark(p,k,w,h,detail){
  const t=TH[k], arr=p.h[k]; if(!arr||!arr.length) return '';
  const pd=4, y=v=>pd+(1-(Math.min(t.max,Math.max(t.min,v))-t.min)/(t.max-t.min))*(h-pd*2), x=i=>i/(arr.length-1)*(w-6)+1;
  const bandTop = t.dir==='low'? y(t.max):y(t.warn), bandBot = t.dir==='low'? y(t.warn):y(t.min);
  const d=arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  const last=arr[arr.length-1], l=lvlOf(k,last), col=l===2?'var(--crit)':l===1?'var(--warn-fill)':'var(--ok)';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${t.name} ย้อนหลัง">
    <rect x="0" y="${bandTop}" width="${w}" height="${bandBot-bandTop}" fill="var(--band)"/>
    ${detail?`<line x1="0" x2="${w}" y1="${y(t.crit)}" y2="${y(t.crit)}" stroke="var(--crit)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".7"/>`:''}
    <path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${x(arr.length-1)}" cy="${y(last)}" r="3.2" fill="${col}"/>
  </svg>`;
}
function bag(p){
  const pct=Math.max(0,Math.min(100,p.v.remaining_pct)), l=lvlOf('remaining_pct',pct);
  const col=l===2?'var(--crit)':l===1?'var(--warn-fill)':'var(--accent)';
  const top=14, bot=100, hgt=(bot-top)*pct/100;
  return `<svg viewBox="0 0 72 112" role="img" aria-label="สารน้ำคงเหลือ ${Math.round(pct)}%">
    <rect x="30" y="2" width="12" height="8" rx="2" fill="var(--line)"/>
    <rect x="12" y="10" width="48" height="94" rx="10" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.5"/>
    <clipPath id="bc"><rect x="13" y="11" width="46" height="92" rx="9"/></clipPath>
    <rect clip-path="url(#bc)" x="12" y="${bot+3-hgt}" width="48" height="${hgt+2}" fill="${col}" opacity=".85"/>
    <line x1="12" x2="22" y1="${bot+3-(bot-top)*.2}" y2="${bot+3-(bot-top)*.2}" stroke="var(--warn)" stroke-width="1.5"/>
    <line x1="12" x2="22" y1="${bot+3-(bot-top)*.1}" y2="${bot+3-(bot-top)*.1}" stroke="var(--crit)" stroke-width="1.5"/>
    <rect x="33" y="104" width="6" height="8" fill="var(--line)"/>
  </svg>`;
}

function filtered(){
  let ps=visiblePatients();
  if(S.f.level!=='all') ps=ps.filter(p=>patientLevel(p)===+S.f.level);
  if(S.f.type!=='all') ps=ps.filter(p=>p.type===S.f.type);

  if(S.f.sort==='bed') return ps.slice().sort((a,b)=>a.ward.localeCompare(b.ward)||a.bed.localeCompare(b.bed,undefined,{numeric:true}));
  return ps.slice().sort((a,b)=>{
    const la=patientLevel(a), lb=patientLevel(b); if(la!==lb) return lb-la;
    const ua=openAlerts(a.id).some(x=>!x.acked_at), ub=openAlerts(b.id).some(x=>!x.acked_at); if(ua!==ub) return ub-ua;
    const ta=(openAlerts(a.id)[0]||{}).created||Infinity, tb=(openAlerts(b.id)[0]||{}).created||Infinity; if(ta!==tb) return ta-tb;
    return a.bed.localeCompare(b.bed,undefined,{numeric:true});
  });
}
function metric(p,k){
  const t=TH[k], v=p.v[k], l=lvlOf(k,v);
  return `<div class="m l${l}" title="${t.name} · ${rangeText(k)}"><span class="ml">${t.label}${k==='remaining_pct'?' คงเหลือ':''}</span><span class="mv">${Math.round(v)}<small>${t.unit==='ครั้ง/นาที'?'/นาที':t.unit}</small></span></div>`;
}

    let ms='';

      ft=`<div class="row"><span class="msg">${esc(a.msg)}${al.length>1?` <span class="quiet">+${al.length-1}</span>`:''}</span><span class="meta" data-ago="${a.created}">${ago(a.created)}</span></div><div class="state">${st}</div>`;
    } else ft=`<div class="row"><span class="quiet">ไม่มีแจ้งเตือนค้าง</span><span class="meta">${p.type==='both'?'2 อุปกรณ์':'1 อุปกรณ์'}</span></div>`;

function histRows(){
  const ids=new Set(visiblePatients().map(p=>p.id));
  let rs=ALERTS.filter(a=>ids.has(a.pid));
  if(S.hf.pid!=='all') rs=rs.filter(a=>a.pid===S.hf.pid);
  if(S.hf.level!=='all') rs=rs.filter(a=>a.level===+S.hf.level);
  const sf={new:a=>!a.acked_at&&!a.resolved_at,ack:a=>a.acked_at&&!a.resolved_at,res:a=>a.resolved_at,esc:a=>a.escalated}[S.hf.status];
  if(sf) rs=rs.filter(sf);
  return rs.sort((a,b)=>b.created-a.created);
}

const artCopy=()=>`<div style="display:flex;align-items:center;gap:10px;position:relative"><span class="brand-mark">${I.pulse}</span><b style="font-size:17px">WardWatch</b></div>
  <div style="position:relative"><h1>เห็นทุกเตียงที่ต้องการคุณก่อน ในหน้าจอเดียว</h1><p>เฝ้าระวังเครื่องช่วยหายใจและปั๊มสารน้ำหลายยี่ห้อแบบเรียลไทม์ จัดลำดับผู้ป่วยตามความเร่งด่วน และบันทึกทุกการตอบสนองไว้ตรวจสอบย้อนหลัง</p></div>`;
function drawEcg(){
  const c=document.getElementById('ecg'); if(!c) return;
  const ctx=c.getContext('2d'), dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr; ctx.scale(dpr,dpr);
  const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#45b8c4';
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.globalAlpha=.85; ctx.beginPath();
  const mid=h*.55; let x=0; ctx.moveTo(0,mid);
  while(x<w){ ctx.lineTo(x+40,mid); ctx.lineTo(x+48,mid-8); ctx.lineTo(x+56,mid); ctx.lineTo(x+64,mid+10); ctx.lineTo(x+72,mid-h*.42); ctx.lineTo(x+80,mid+h*.18); ctx.lineTo(x+88,mid); ctx.lineTo(x+110,mid); ctx.lineTo(x+122,mid-14); ctx.lineTo(x+134,mid); x+=150; }
  ctx.stroke();
}
function bindAuth(){
  drawEcg();
  root.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{S.login={tab:b.dataset.atab,err:''};render();});
  const bl=document.getElementById('backLogin'); if(bl) bl.onclick=()=>{S.auth='login';S.login={tab:'login',err:''};render();};
  const f=document.getElementById('authForm'); if(!f) return;
  f.onsubmit=e=>{
    e.preventDefault();
    const em=document.getElementById('fEmail').value.trim().toLowerCase(), pw=document.getElementById('fPw').value;
    if(S.login.tab==='register'){
      const nm=(document.getElementById('fName').value||'').trim();
      if(!nm||!/^\S+@\S+\.\S+$/.test(em)) { S.login.err='กรอกชื่อและอีเมลให้ถูกต้อง'; return render(); }
      if(pw.length<8){ S.login.err='รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร'; return render(); }
      if(STAFF.some(s=>s.email===em)){ S.login.err='อีเมลนี้มีบัญชีอยู่แล้ว ลองเข้าสู่ระบบแทน'; return render(); }
      const u={id:'u'+(STAFF.length+1),name:nm,email:em,role:'nurse',ward:null,created:new Date().toISOString().slice(0,10),pending:true};
      STAFF.push(u); S.newUser=u; S.auth='pending'; return render();
    }
    const u=STAFF.find(s=>s.email===em);
    if(!u){ S.login.err='ไม่พบบัญชีนี้ ตรวจสอบอีเมลหรือสมัครสมาชิกก่อน'; return render(); }
    if(u.pending){ S.newUser=u; S.auth='pending'; return render(); }
    ME[u.role]=u.id; S.role=u.role; S.auth='app'; S.view=u.role==='admin'?'users':'dashboard'; S.sel=null; render();
  };
}

  document.querySelectorAll('[data-ago]').forEach(e=>e.textContent=ago(+e.dataset.ago));

}

/* ---------- actions ---------- */
function ack(id){ const a=ALERTS.find(x=>x.id===id); if(!a||a.acked_at) return; a.acked_at=Date.now(); a.acked_by=meId(); toast('รับทราบแล้ว', `${a.msg} · บันทึกชื่อและเวลาแล้ว`, 'ok'); rerenderDrawerAndGrid(); }
function escalate(id){ const a=ALERTS.find(x=>x.id===id); if(!a||a.escalated) return; a.escalated=true; a.escalated_at=Date.now(); a.to='ทีมฉุกเฉิน (Rapid Response)'; const p=P.find(x=>x.id===a.pid); toast(`ส่งต่อทีมฉุกเฉินแล้ว · เตียง ${p.bed}`, 'ทีม Rapid Response เห็นเคสนี้ในแดชบอร์ดของทีมแล้ว', 'ok'); rerenderDrawerAndGrid(); }
function resolve(id){
  const a=ALERTS.find(x=>x.id===id), note=(S.drafts[id]||'').trim(); if(!a||!note) return;
  if(!a.acked_at){a.acked_at=Date.now(); a.acked_by=meId();}
  a.resolved_at=Date.now(); a.resolved_by=meId(); a.note=note; delete S.drafts[id];
  const p=P.find(x=>x.id===a.pid);
  // simulate the intervention working
  if(VENT_P.includes(a.param)&&p.base) p.base[a.param]=NORM[a.param];
  if(a.param==='remaining_pct'){ p.ivMl=p.iv.vol; p.v.remaining_pct=100; }
  if(a.param==='pump'){ p.pump='running'; }
  toast('บันทึกการแก้ไขแล้ว', `เตียง ${p.bed} · ${note}`, 'ok'); rerenderDrawerAndGrid();
}
function rerenderDrawerAndGrid(){
  const p=P.find(x=>x.id===S.sel), da=document.getElementById('drAlerts');
  if(da&&p){ da.innerHTML=renderDrAlerts(p); da.dataset.sig=''; }
  const mini=document.getElementById('drMini'); if(mini&&p) mini.innerHTML=renderMini(p);
  refreshLive(); bindDrawer();
}

/* ---------- binding ---------- */
function bindGrid(){
  root.querySelectorAll('.bed').forEach(el=>{
    el.onclick=()=>openPatient(el.dataset.pid);
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openPatient(el.dataset.pid);} };
  });
  root.querySelectorAll('[data-flevel]').forEach(b=>b.onclick=()=>{ S.f.level = S.f.level===b.dataset.flevel?'all':b.dataset.flevel; refreshLive(); });
}
function openPatient(id){ S.sel=id; render(); const c=document.getElementById('closeDr'); if(c) c.focus(); }
function closeDrawer(){ const id=S.sel; S.sel=null; render(); const el=root.querySelector(`.bed[data-pid="${id}"]`); if(el) el.focus(); }
function bindDrawer(){
  root.querySelectorAll('[data-ack]').forEach(b=>b.onclick=()=>ack(+b.dataset.ack));
  root.querySelectorAll('[data-escal]').forEach(b=>b.onclick=()=>escalate(+b.dataset.escal));
  root.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>resolve(+b.dataset.resolve));
  root.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{ S.drafts[t.dataset.note]=t.value; const b=root.querySelector(`[data-resolve="${t.dataset.note}"]`); if(b) b.disabled=!t.value.trim(); });
  root.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{ const id=b.dataset.quick, t=document.getElementById('note-'+id); const cur=(t.value||'').trim(); t.value = cur? cur+(cur.endsWith(' ')?'':' ')+b.dataset.txt : b.dataset.txt; t.dispatchEvent(new Event('input')); t.focus(); });
}
function bindApp(){
  root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; S.sel=null; render(); window.scrollTo(0,0); });
  bindGrid();
  root.querySelectorAll('[data-ftype]').forEach(b=>b.onclick=()=>{ S.f.type=b.dataset.ftype; root.querySelectorAll('[data-ftype]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); refreshLive(); });
  root.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ S.f.sort=b.dataset.sort; root.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); refreshLive(); });
  const q=document.getElementById('q'); if(q) q.oninput=()=>{ S.f.q=q.value; refreshLive(); };
  const bell=document.getElementById('bellBtn'); if(bell) bell.onclick=()=>{ S.f.level='all'; S.f.sort='priority'; const first=filtered().find(p=>openAlerts(p.id).some(a=>!a.acked_at)); if(first) openPatient(first.id); else toast('ไม่มีแจ้งเตือนค้าง','ทุกแจ้งเตือนมีผู้รับทราบแล้ว','ok'); };
  if(S.sel){
    document.getElementById('closeDr').onclick=closeDrawer; document.getElementById('scrim').onclick=closeDrawer;
    const th=document.getElementById('toHist'); if(th) th.onclick=()=>{ S.hf={pid:S.sel,level:'all',status:'all'}; S.view='history'; S.sel=null; render(); };
    const da=document.getElementById('drAlerts'); da.dataset.sig=openAlerts(S.sel).map(a=>a.id+':'+(a.acked_at?1:0)+(a.escalated?1:0)).join(',');
    bindDrawer();
  }
  // history
  if(document.getElementById('hBody')){
    fillHistory();
    [['hfP','pid'],['hfL','level'],['hfS','status']].forEach(([id,k])=>{ const el=document.getElementById(id); el.onchange=()=>{ S.hf[k]=el.value; fillHistory(); }; });
    document.getElementById('hBody').onclick=e=>{ const a=e.target.closest('[data-openp]'); if(a){ e.preventDefault(); S.view='dashboard'; openPatient(a.dataset.openp); } };
  }
  // users
  if(document.getElementById('uBody')){
    fillUsers(); bindUsers();
    root.querySelectorAll('[data-utab]').forEach(b=>b.onclick=()=>{ S.uf.tab=b.dataset.utab; root.querySelectorAll('[data-utab]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); fillUsers(); bindUsers(); });
    const uq=document.getElementById('uq'); uq.oninput=()=>{ S.uf.q=uq.value; fillUsers(); bindUsers(); };
  }
}
function bindUsers(){
  const chk=id=>{ const s=staff(id), r=root.querySelector(`[data-urole="${id}"]`).value, w=root.querySelector(`[data-uward="${id}"]`).value, b=root.querySelector(`[data-usave="${id}"]`);
    const needWard = r!=='admin';
    b.disabled = (needWard && !w) || (!s.pending && r===s.role && (w||null)===s.ward);
    b.title = needWard && !w ? 'เลือกหอผู้ป่วยก่อน' : ''; };
  root.querySelectorAll('[data-urole],[data-uward]').forEach(el=>el.onchange=()=>chk(el.dataset.urole||el.dataset.uward));
  root.querySelectorAll('[data-usave]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.usave, s=staff(id), r=root.querySelector(`[data-urole="${id}"]`).value, w=root.querySelector(`[data-uward="${id}"]`).value||null;
    const was=s.pending; s.role=r; s.ward=r==='admin'?null:w; s.pending=false;
    S.roleLog.unshift({t:Date.now(),who:'a1',target:id,txt:`กำหนดบทบาท ${ROLE_TH[r]}${s.ward?' · '+WARDS[s.ward]:''}`});
    toast(was?`อนุมัติ ${s.name} แล้ว`:`บันทึกสิทธิ์ของ ${s.name} แล้ว`, `${ROLE_TH[r]}${s.ward?' · '+WARDS[s.ward]:''} · ส่งอีเมลแจ้งผู้ใช้แล้ว`, 'ok');
    render();
  });
}

/* ---------- global controls ---------- */
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>{
  S.role=b.dataset.role; S.auth='app'; S.sel=null; ME.nurse='n1'; ME.physician='d1';
  S.view = S.role==='admin' ? (S.view==='spec'?'spec':'users') : (S.view==='users'?'dashboard':S.view);
  S.hf={pid:'all',level:'all',status:'all'}; render();
});
document.getElementById('toSpec').onclick=()=>{ if(S.auth!=='app'){S.auth='app';} S.view='spec'; S.sel=null; render(); window.scrollTo(0,0); };
document.getElementById('toLogin').onclick=()=>{ S.auth='login'; S.login={tab:'login',err:''}; S.sel=null; render(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.sel) closeDrawer(); });
window.addEventListener('resize',()=>{ if(S.auth!=='app') drawEcg(); });

render();
setInterval(tick,2000);
setInterval(perturb,20000);
</script>
</body>
</html>
