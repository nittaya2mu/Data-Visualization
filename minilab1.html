<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Lab 1: HTML5 Semantic & Responsive Layout</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --accent-peak: #f59e0b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 24px;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }
    header h1 { font-size: 24px; color: var(--text-dark); }
    header p { color: var(--text-muted); font-size: 14px; }
    
    /* Responsive Flexbox Layout (Mobile First) */
    .kpi-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (min-width: 768px) {
      .kpi-container {
        flex-direction: row;
      }
    }
    .kpi-card {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }
    .kpi-card:hover { transform: translateY(-3px); }
    .kpi-card.highlight {
      border-left: 4px solid var(--accent-peak);
      background: #fffbe1;
    }
    .kpi-card h2 {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .kpi-card .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
    }
    .kpi-card .sub-text {
      font-size: 13px;
      color: #10b981;
      font-weight: 500;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mini-Lab 1: Semantic Web & Layout</h1>
    <p>รายงานภาพรวม KPI (Mobile-First Responsive Design)</p>
  </header>

  <main>
    <section class="kpi-container" aria-label="Key Performance Indicators">
      <article class="kpi-card">
        <h2>ยอดขายรวมทั้งหมด</h2>
        <div class="value">4,250,000 ฿</div>
        <div class="sub-text"><i class="fa-solid fa-arrow-trend-up"></i> +18.5% YoY</div>
      </article>
      
      <article class="kpi-card highlight">
        <h2>เดือนที่ยอดขายสูงสุด</h2>
        <div class="value" style="color: #d97706;">580,000 ฿</div>
        <div class="sub-text" style="color: #b45309;"><i class="fa-solid fa-crown"></i> สิงหาคม (Aug)</div>
      </article>
      
      <article class="kpi-card">
        <h2>ยอดขายเฉลี่ยรายเดือน</h2>
        <div class="value">354,166 ฿</div>
        <div class="sub-text" style="color: var(--text-muted);">เป้าหมาย 300,000 ฿/เดือน</div>
      </article>
    </section>
  </main>

  <footer>
    <p style="font-size: 12px; color: var(--text-muted);">พัฒนาตามมาตรฐาน HTML5 Semantic Tags</p>
  </footer>
</body>
</html>
