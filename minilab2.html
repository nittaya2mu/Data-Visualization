<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Lab 2: SVG Data Visualization</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --accent-peak: #f59e0b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 24px;
    }
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      max-width: 800px;
      margin: 0 auto;
    }
    .chart-header {
      margin-bottom: 20px;
    }
    .chart-header h1 { font-size: 22px; color: var(--text-dark); }
    .chart-header p { font-size: 14px; color: var(--text-muted); }
    
    /* SVG Styling */
    svg.bar-chart {
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .bar {
      fill: var(--primary);
      transition: fill 0.2s ease;
    }
    .bar:hover { fill: #1d4ed8; }
    .bar-peak {
      fill: var(--accent-peak);
      transition: fill 0.2s ease;
    }
    .bar-peak:hover { fill: #d97706; }
    .axis-line { stroke: #cbd5e1; stroke-width: 1.5; }
    .axis-label { font-size: 11px; fill: var(--text-muted); text-anchor: middle; }
    .value-label { font-size: 10px; fill: var(--text-dark); font-weight: 600; text-anchor: middle; }
  </style>
</head>
<body>
  <main class="chart-card">
    <header class="chart-header">
      <h1>Mini-Lab 2: SVG Bar Chart</h1>
      <p>แสดงยอดขายรายเดือน ปี 2026 พร้อมคุณสมบัติ ARIA Accessibility</p>
    </header>

    <section>
      <svg class="bar-chart" viewBox="0 0 680 230" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">กราฟแท่งแสดงยอดขายรายเดือน ปี 2026</title>
        <desc id="svg-desc">กราฟแสดงยอดขายรายเดือนรวม 4.25 ล้านบาท สูงสุดเดือนสิงหาคม 580,000 บาท</desc>
        
        <!-- Axis Baseline & Gridlines -->
        <line x1="40" y1="180" x2="660" y2="180" class="axis-line" />
        <line x1="40" y1="40" x2="660" y2="40" stroke="#f1f5f9" stroke-dasharray="4" />
        <text x="32" y="44" class="axis-label" style="text-anchor: end;">600k</text>
        <line x1="40" y1="110" x2="660" y2="110" stroke="#f1f5f9" stroke-dasharray="4" />
        <text x="32" y="114" class="axis-label" style="text-anchor: end;">300k</text>

        <!-- Bars & Labels (Jan - Dec) -->
        <!-- Jan: 250k -->
        <rect x="50" y="122" width="36" height="58" class="bar" rx="3" />
        <text x="68" y="116" class="value-label">250k</text>
        <text x="68" y="198" class="axis-label">Jan</text>

        <!-- Feb: 310k -->
        <rect x="100" y="108" width="36" height="72" class="bar" rx="3" />
        <text x="118" y="102" class="value-label">310k</text>
        <text x="118" y="198" class="axis-label">Feb</text>

        <!-- Mar: 280k -->
        <rect x="150" y="115" width="36" height="65" class="bar" rx="3" />
        <text x="168" y="109" class="value-label">280k</text>
        <text x="168" y="198" class="axis-label">Mar</text>

        <!-- Apr: 420k -->
        <rect x="200" y="82" width="36" height="98" class="bar" rx="3" />
        <text x="218" y="76" class="value-label">420k</text>
        <text x="218" y="198" class="axis-label">Apr</text>

        <!-- May: 390k -->
        <rect x="250" y="89" width="36" height="91" class="bar" rx="3" />
        <text x="268" y="83" class="value-label">390k</text>
        <text x="268" y="198" class="axis-label">May</text>

        <!-- Jun: 510k -->
        <rect x="300" y="61" width="36" height="119" class="bar" rx="3" />
        <text x="318" y="55" class="value-label">510k</text>
        <text x="318" y="198" class="axis-label">Jun</text>

        <!-- Jul: 480k -->
        <rect x="350" y="68" width="36" height="112" class="bar" rx="3" />
        <text x="368" y="62" class="value-label">480k</text>
        <text x="368" y="198" class="axis-label">Jul</text>

        <!-- Aug: 580k (Peak) -->
        <rect x="400" y="45" width="36" height="135" class="bar-peak" rx="3" />
        <text x="418" y="38" class="value-label" style="fill: #b45309; font-weight: 700;">580k ★</text>
        <text x="418" y="198" class="axis-label" style="fill: #b45309; font-weight: 700;">Aug</text>

        <!-- Sep: 460k -->
        <rect x="450" y="73" width="36" height="107" class="bar" rx="3" />
        <text x="468" y="67" class="value-label">460k</text>
        <text x="468" y="198" class="axis-label">Sep</text>

        <!-- Oct: 320k -->
        <rect x="500" y="105" width="36" height="75" class="bar" rx="3" />
        <text x="518" y="99" class="value-label">320k</text>
        <text x="518" y="198" class="axis-label">Oct</text>

        <!-- Nov: 180k -->
        <rect x="550" y="138" width="36" height="42" class="bar" rx="3" />
        <text x="568" y="132" class="value-label">180k</text>
        <text x="568" y="198" class="axis-label">Nov</text>

        <!-- Dec: 80k -->
        <rect x="600" y="161" width="36" height="19" class="bar" rx="3" />
        <text x="618" y="155" class="value-label">80k</text>
        <text x="618" y="198" class="axis-label">Dec</text>
      </svg>
    </section>
  </main>
</body>
</html>
